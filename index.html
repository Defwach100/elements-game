<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101a22">
<meta name="description" content="ELEMENTS: The Art of Bending — prototype 0.1">
<link rel="manifest" href="manifest.webmanifest">
<title>ELEMENTS: The Art of Bending</title>
<style>
:root{color-scheme:dark;--glass:rgba(10,20,28,.72);--line:rgba(220,240,255,.22)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a22;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:#f2f7fa}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand{font-weight:800;letter-spacing:.16em;font-size:clamp(12px,2vw,16px);text-shadow:0 2px 8px #000}
.sub{font-size:10px;opacity:.72;letter-spacing:.14em;margin-top:3px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 11px;backdrop-filter:blur(8px);font-size:12px;box-shadow:0 5px 24px #0005}
#status{max-width:48vw;text-align:right}
#hint{position:absolute;left:50%;top:15%;transform:translateX(-50%);white-space:nowrap;text-align:center;font-size:12px;opacity:.9}
#bottomHint{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;font-size:11px;opacity:.78;text-shadow:0 2px 5px #000}
#mobileControls{position:fixed;inset:0;pointer-events:none;display:none}
#stickArea{position:absolute;left:18px;bottom:max(25px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:#0b1724a0;border:1px solid #d8edff55;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:52px;height:52px;left:39px;top:39px;border-radius:50%;background:#c9e8f0aa;border:1px solid #fff9;box-shadow:0 3px 14px #0007}
#lookArea{position:absolute;right:0;top:18%;width:55%;height:62%;pointer-events:auto;touch-action:none}
#mobileLabel{position:absolute;left:18px;bottom:170px;font-size:10px;letter-spacing:.1em;opacity:.65}
#rotate{position:fixed;inset:0;background:#0d1720;color:white;display:none;z-index:5;align-items:center;justify-content:center;text-align:center;padding:30px}
#rotate div{max-width:300px}.rotateIcon{font-size:42px;margin-bottom:12px}
@media(orientation:portrait){#rotate{display:flex}#hud,#mobileControls{display:none!important}}
@media(pointer:coarse){#mobileControls{display:block}#bottomHint{bottom:170px}}
#crosshair{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#fff9;box-shadow:0 0 8px #fff}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="top">
  <div class="panel"><div class="brand">ELEMENTS</div><div class="sub">THE ART OF BENDING · PROTOTYPE 0.1</div></div>
  <div class="panel" id="status">FOUNDATION BUILD<br><span style="opacity:.7">Movement · Camera · World</span></div>
 </div>
 <div id="hint" class="panel">Explore the training grounds</div>
 <div id="crosshair"></div>
 <div id="bottomHint">WASD / ARROWS to move · drag to look · SHIFT to run</div>
</div>
<div id="mobileControls">
 <div id="stickArea"><div id="stick"></div></div>
 <div id="lookArea"></div>
 <div id="mobileLabel">MOVE</div>
</div>
<div id="rotate"><div><div class="rotateIcon">↻</div><strong>Rotate your device</strong><p>This game is designed for landscape mode.</p></div></div>
<script>
(() => {
const canvas=document.getElementById('game'), gl=canvas.getContext('webgl',{antialias:true,alpha:false});
if(!gl){document.getElementById('hint').textContent='WebGL is not available in this browser.';return;}
const vs=`attribute vec3 p; attribute vec3 c; uniform mat4 mvp; varying vec3 col; void main(){gl_Position=mvp*vec4(p,1.);gl_PointSize=4.;col=c;}`;
const fs=`precision mediump float; varying vec3 col; void main(){gl_FragColor=vec4(col,1.);}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);
const locP=gl.getAttribLocation(prog,'p'),locC=gl.getAttribLocation(prog,'c'),locM=gl.getUniformLocation(prog,'mvp');
const verts=[],cols=[];
function tri(a,b,c,color){for(const v of [a,b,c]){verts.push(...v);cols.push(...color);}}
function quad(a,b,c,d,color){tri(a,b,c,color);tri(a,c,d,color);}
function box(x,y,z,sx,sy,sz,color){
 const x0=x-sx/2,x1=x+sx/2,y0=y,y1=y+sy,z0=z-sz/2,z1=z+sz/2;
 quad([x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],color);
 quad([x1,y0,z1],[x0,y0,z1],[x0,y1,z1],[x1,y1,z1],color);
 quad([x0,y0,z1],[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],color);
 quad([x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0],color);
 quad([x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1],color);
 quad([x0,y0,z1],[x1,y0,z1],[x1,y0,z0],[x0,y0,z0],color);
}
function pyramid(x,z,r,h,color){
 const y=0,top=[x,y+h,z],n=7;
 for(let i=0;i<n;i++){let a=i*2*Math.PI/n,b=(i+1)*2*Math.PI/n;
 tri(top,[x+Math.cos(a)*r,0,z+Math.sin(a)*r],[x+Math.cos(b)*r,0,z+Math.sin(b)*r],color);}
}
function addWorld(){
 // broad terrain tiles
 for(let x=-90;x<90;x+=10)for(let z=-90;z<90;z+=10){
  let v=((x*13+z*7)%5+5)%5;let c=v===0?[.22,.34,.27]:v===1?[.24,.37,.29]:[.27,.39,.30];
  quad([x,0,z],[x+10,0,z],[x+10,0,z+10],[x,0,z+10],c);
 }
 // distant mountain ridges
 for(let i=0;i<34;i++){let x=-100+i*6;let z=-72-(i%4)*5;pyramid(x,z,8+(i%5)*2,13+(i%6)*3,[.28,.34,.37]);}
 // training circle
 for(let i=0;i<64;i++){let a=i*Math.PI*2/64,r=8;let x=Math.cos(a)*r,z=Math.sin(a)*r;
  box(x,.025,z,.34,.05,.34,[.56,.55,.46]);}
 // stone markers
 for(let i=0;i<8;i++){let a=i*Math.PI/4;let x=Math.cos(a)*10,z=Math.sin(a)*10;box(x,0,z,.7,1.5,.7,[.43,.48,.48]);}
 // trees
 for(let i=0;i<90;i++){let x=((i*37)%150)-75,z=((i*61)%150)-75;if(Math.hypot(x,z)<15)continue;
  box(x,0,z,.65,3,.65,[.27,.20,.14]);pyramid(x,z,2.1,4.8,[.16,.32,.22]);pyramid(x,z,1.55,6.2,[.19,.39,.25]);}
 // scattered boulders
 for(let i=0;i<24;i++){let x=((i*29)%100)-50,z=((i*43)%100)-50;if(Math.hypot(x,z)<12)continue;
  box(x,0,z,1.8+(i%3),.8+(i%2)*.5,1.6,[.38,.42,.42]);}
}
addWorld();
let worldV=new Float32Array(verts),worldC=new Float32Array(cols);
const worldBuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,worldBuf);gl.bufferData(gl.ARRAY_BUFFER,worldV,gl.STATIC_DRAW);
const colorBuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,colorBuf);gl.bufferData(gl.ARRAY_BUFFER,worldC,gl.STATIC_DRAW);
function bindBuffers(){gl.bindBuffer(gl.ARRAY_BUFFER,worldBuf);gl.enableVertexAttribArray(locP);gl.vertexAttribPointer(locP,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,colorBuf);gl.enableVertexAttribArray(locC);gl.vertexAttribPointer(locC,3,gl.FLOAT,false,0,0);}
const extraV=[],extraC=[];
function addChar(){
 extraV.length=0;extraC.length=0;
 function t(a,b,c,col){for(let v of [a,b,c]){extraV.push(...v);extraC.push(...col);}}
 function b(x,y,z,sx,sy,sz,col){
  let x0=x-sx/2,x1=x+sx/2,y0=y,y1=y+sy,z0=z-sz/2,z1=z+sz/2;
  let faces=[[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],[[x1,y0,z1],[x0,y0,z1],[x0,y1,z1],[x1,y1,z1]],[[x0,y0,z1],[x0,y0,z0],[x0,y1,z0],[x0,y1,z1]],[[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],[[x0,y0,z1],[x1,y0,z1],[x1,y0,z0],[x0,y0,z0]]];
  for(let f of faces){t(f[0],f[1],f[2],col);t(f[0],f[2],f[3],col);}
 }
 // simple stylised martial-artist figure, local forward is -Z
 b(-.22,0,0,.22,.82,.25,[.12,.20,.27]);b(.22,0,0,.22,.82,.25,[.12,.20,.27]);
 b(0,.78,0,.66,.82,.38,[.20,.34,.43]);b(0,1.58,0,.48,.48,.43,[.73,.56,.39]);
 b(-.48,.85,0,.22,.72,.24,[.73,.56,.39]);b(.48,.85,0,.22,.72,.24,[.73,.56,.39]);
 b(0,1.88,-.02,.5,.13,.46,[.13,.18,.22]);
 return [new Float32Array(extraV),new Float32Array(extraC)];
}
const charData=addChar();let charBuf=gl.createBuffer(),charColBuf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,charBuf);gl.bufferData(gl.ARRAY_BUFFER,charData[0],gl.DYNAMIC_DRAW);
gl.bindBuffer(gl.ARRAY_BUFFER,charColBuf);gl.bufferData(gl.ARRAY_BUFFER,charData[1],gl.DYNAMIC_DRAW);
const keys={};onkeydown=e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();};onkeyup=e=>keys[e.key.toLowerCase()]=false;
let px=0,pz=0,yaw=0,pitch=.18,moveX=0,moveY=0,run=false;
const stickArea=document.getElementById('stickArea'),stick=document.getElementById('stick'),lookArea=document.getElementById('lookArea');
let stickId=null,lookId=null,lastLookX=0,lastLookY=0;
function stickMove(e){let r=stickArea.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=42;if(len>max){dx*=max/len;dy*=max/len;}moveX=dx/max;moveY=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`;}
stickArea.addEventListener('pointerdown',e=>{stickId=e.pointerId;stickArea.setPointerCapture(stickId);stickMove(e);});
stickArea.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});
function resetStick(){stickId=null;moveX=moveY=0;stick.style.transform='translate(0,0)';}
stickArea.addEventListener('pointerup',resetStick);stickArea.addEventListener('pointercancel',resetStick);
lookArea.addEventListener('pointerdown',e=>{lookId=e.pointerId;lastLookX=e.clientX;lastLookY=e.clientY;lookArea.setPointerCapture(lookId);});
lookArea.addEventListener('pointermove',e=>{if(e.pointerId===lookId){let dx=e.clientX-lastLookX,dy=e.clientY-lastLookY;lastLookX=e.clientX;lastLookY=e.clientY;yaw-=dx*.006;pitch=Math.max(-.12,Math.min(.75,pitch+dy*.003));}});
lookArea.addEventListener('pointerup',()=>lookId=null);lookArea.addEventListener('pointercancel',()=>lookId=null);
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){lookId=e.pointerId;lastLookX=e.clientX;lastLookY=e.clientY;canvas.setPointerCapture(lookId);}});
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&lookId===e.pointerId){yaw-=(e.clientX-lastLookX)*.006;pitch=Math.max(-.12,Math.min(.75,pitch+(e.clientY-lastLookY)*.003));lastLookX=e.clientX;lastLookY=e.clientY;}});
canvas.addEventListener('pointerup',()=>lookId=null);
function matMul(a,b){let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;}
function perspective(fov,aspect,near,far){let f=1/Math.tan(fov/2),nf=1/(near-far);return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0]);}
function lookAt(eye,center,up){let z=norm(sub(eye,center)),x=norm(cross(up,z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);}
const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{let l=Math.hypot(...a)||1;return a.map(v=>v/l);};
function resize(){let d=Math.min(devicePixelRatio||1,1.7),w=Math.floor(innerWidth*d),h=Math.floor(innerHeight*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}}
function drawObject(buf,cbuf,count,mvp){gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(locP);gl.vertexAttribPointer(locP,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,cbuf);gl.enableVertexAttribArray(locC);gl.vertexAttribPointer(locC,3,gl.FLOAT,false,0,0);gl.uniformMatrix4fv(locM,false,mvp);gl.drawArrays(gl.TRIANGLES,0,count);}
function frame(){
 resize();let f=keys['w']||keys['arrowup']?-1:0,b=keys['s']||keys['arrowdown']?1:0,l=keys['a']||keys['arrowleft']?-1:0,r=keys['d']||keys['arrowright']?1:0;
 let ix=l+r+moveX,iy=f+b+moveY;run=!!(keys['shift']);let mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag;}
 let speed=run?.16:.085;let fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
 px+=(rx*ix+fx*(-iy))*speed;pz+=(rz*ix+fz*(-iy))*speed;
 px=Math.max(-78,Math.min(78,px));pz=Math.max(-78,Math.min(78,pz));
 let forward=[Math.sin(yaw),0,Math.cos(yaw)];
 let target=[px,1.1,pz],dist=7.5,ce=[px+Math.sin(yaw)*dist*Math.cos(pitch),3.0+Math.sin(pitch)*dist,pz+Math.cos(yaw)*dist*Math.cos(pitch)];
 let view=lookAt(ce,target,[0,1,0]),proj=perspective(Math.PI/3,canvas.width/canvas.height,.1,250),vp=matMul(proj,view);
 gl.enable(gl.DEPTH_TEST);gl.clearColor(.48,.68,.78,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 bindBuffers();gl.uniformMatrix4fv(locM,false,vp);gl.drawArrays(gl.TRIANGLES,0,verts.length/3);
 // rotate character to movement direction, facing camera-relative travel
 let dir=Math.hypot(ix,iy)>.08?Math.atan2(ix,-iy):yaw;
 let model=new Float32Array([Math.cos(dir),0,-Math.sin(dir),0,0,1,0,0,Math.sin(dir),0,Math.cos(dir),0,px,0,pz,1]);
 let charMvp=matMul(vp,model);
 drawObject(charBuf,charColBuf,charData[0].length/3,charMvp);
 requestAnimationFrame(frame);
}
frame();
if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
document.getElementById('hint').addEventListener('click',()=>{});
document.addEventListener('contextmenu',e=>e.preventDefault());
})();
</script>
</body>
</html>
